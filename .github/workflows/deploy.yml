name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Terraform Apply
        run: |
          cd terraform/environments/dev
          terraform init || true
          terraform apply -auto-approve || true
      - name: Build Image
        run: docker build -f infra/docker/app.Dockerfile -t fraud-app .
